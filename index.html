<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1440">
<meta name="mobile-web-app-capable" content="yes">
<title>Quỷ nhỏ</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd86b;--night:#0b1440;--red:#c8281e;--cream:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;-webkit-text-size-adjust:100%;touch-action:manipulation;margin:0;background:var(--night);overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--cream)}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
@media(orientation:portrait){.bg{background-position:68% center}}
.veil{position:fixed;inset:0;z-index:2;background:radial-gradient(circle at 50% 52%,rgba(10,18,62,.4),rgba(3,7,28,.88));opacity:0;pointer-events:none;transition:opacity .9s}
.on .veil{opacity:1;pointer-events:auto}
.stage{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .6s,filter .6s}
.on .stage{opacity:1}
.open .stage{filter:blur(4px) brightness(.45)}
.scene{position:relative;width:min(300px,72vw,44vh);aspect-ratio:1}
.glow{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(255,206,90,.5),transparent 65%);opacity:0;transition:opacity 1.2s}
.a .glow{opacity:1}
.cake{position:absolute;inset:0;opacity:0;filter:drop-shadow(0 12px 22px rgba(0,0,0,.5))}
.a .cake{animation:drop 1.3s cubic-bezier(.3,.8,.4,1) forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-90vh) scale(.5) rotate(-25deg)}55%{opacity:1;transform:translateY(7%) scale(1.06) rotate(5deg)}78%{transform:translateY(-3%) rotate(-2deg)}100%{opacity:1;transform:none}}
.half{position:absolute;inset:0;transition:transform 1s cubic-bezier(.2,.9,.3,1)}
.half svg{display:block;width:100%;height:100%}
.hl{clip-path:inset(0 50% 0 0)}.hr{clip-path:inset(0 0 0 50%)}
.s .hl{transform:translateX(-24%) rotate(-10deg)}
.s .hr{transform:translateX(24%) rotate(10deg)}
.seam{position:absolute;left:50%;top:4%;bottom:4%;width:3px;margin-left:-1.5px;background:linear-gradient(#fff,var(--gold));box-shadow:0 0 14px var(--gold);transform:scaleY(0);transform-origin:top;opacity:0}
.c .seam{animation:seam 1s ease-in forwards}
@keyframes seam{to{transform:scaleY(1);opacity:1}}
.s .seam{animation:none;opacity:0}
.knife{position:absolute;left:50%;top:-12%;height:112%;aspect-ratio:40/300;opacity:0;transform:translate(-50%,-135%);z-index:2}
.knife svg{width:100%;height:100%;display:block}
.c .knife{animation:cut 1s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes cut{from{opacity:1;transform:translate(-50%,-135%)}to{opacity:1;transform:translate(-50%,0)}}
.s .knife{animation:lift .7s ease-in forwards}
@keyframes lift{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-160%)}}
.slip{position:absolute;left:50%;top:50%;width:max(30%,70px);aspect-ratio:.6;transform:translate(-50%,-50%) scale(0);opacity:0;z-index:1;border:2px solid var(--gold);border-radius:6px;background:linear-gradient(160deg,#e23a2b,#a01818);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--gold);font-family:'Dancing Script',cursive;font-size:clamp(14px,4vw,18px);text-align:center;box-shadow:0 0 0 rgba(255,216,107,0);cursor:pointer;pointer-events:none;-webkit-tap-highlight-color:transparent;padding:0;font-weight:600}
.slip b{font:400 clamp(26px,8vw,38px) serif}
.s .slip{animation:rise 1.1s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}100%{opacity:1;transform:translate(-50%,-78%) scale(1) rotate(-4deg)}}
.r .slip{pointer-events:auto;animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{opacity:1;transform:translate(-50%,-78%) rotate(-4deg) scale(1);box-shadow:0 0 10px rgba(255,216,107,.4)}50%{opacity:1;transform:translate(-50%,-84%) rotate(4deg) scale(1.07);box-shadow:0 0 30px rgba(255,216,107,.95)}}
.slip:focus-visible{outline:3px solid #fff;outline-offset:3px}
.spark{position:absolute;left:50%;top:50%;pointer-events:none}
.spark i{position:absolute;width:9px;height:9px;margin:-4px;border-radius:50%;background:radial-gradient(#fff,var(--gold));animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.cap{margin:34px 18px 0;min-height:2.6em;text-align:center;font:600 clamp(22px,5.5vw,30px)/1.3 'Dancing Script',cursive;color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.6);transition:opacity .25s}
.again{min-height:48px;position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;border:0;border-radius:99px;padding:14px 26px;font:600 16px 'Be Vietnam Pro',sans-serif;color:#4a1a00;background:linear-gradient(#ffe38f,#f2b73d);box-shadow:0 6px 24px rgba(255,190,60,.55);cursor:pointer;transition:opacity .5s,transform .3s;animation:beat 2.2s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 6px 40px rgba(255,210,90,.95)}}
.on .again{opacity:0;pointer-events:none}
.again:hover{transform:translateX(-50%) scale(1.05)}
.card{position:fixed;inset:0;z-index:5;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;opacity:0;pointer-events:none;transition:opacity .4s}
.open .card{opacity:1;pointer-events:auto}
.paper{margin:auto;width:min(430px,100%);max-height:calc(100vh - 40px);box-sizing:border-box;padding:42px 28px 30px;text-align:center;background:linear-gradient(180deg,#f6e3b1 0%,#ecd09a 48%,#e4bd78 100%);color:#5b3218;border:2px solid #b9782e;border-radius:12px;outline:1px solid rgba(255,230,150,.9);outline-offset:-9px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 45px rgba(255,190,60,.28);position:relative;overflow-y:auto;overflow-x:hidden;scrollbar-width:auto}
.paper:before,.paper:after{content:"";position:absolute;left:8px;right:8px;height:18px;border-radius:50%;background:linear-gradient(180deg,#d59a4d,#f0cf8b 55%,#bd7730);box-shadow:0 2px 7px rgba(70,35,10,.35);z-index:0}
.paper:before{top:8px}
.paper:after{bottom:8px}
.open .paper{animation:scrollUnfold .9s cubic-bezier(.2,.9,.3,1.08) both;transform-origin:center}
@keyframes scrollUnfold{from{opacity:0;transform:scaleY(.06) scaleX(.82)}to{opacity:1;transform:scaleY(1) scaleX(1)}}
.paper>*{position:relative;z-index:1}
.paper::-webkit-scrollbar{width:10px}
.paper::-webkit-scrollbar-track{background:rgba(120,70,20,.12);border-radius:10px}
.paper::-webkit-scrollbar-thumb{background:#a86b2b;border-radius:10px;border:2px solid #e8c98f}
.open .paper{animation:scrollUnfold 2.4s cubic-bezier(.16,.82,.25,1) both;transform-origin:center}
@keyframes scrollUnfold{
  0%{transform:scaleY(.035) scaleX(.82);filter:brightness(.72)}
  18%{transform:scaleY(.07) scaleX(.86)}
  42%{transform:scaleY(.24) scaleX(.92)}
  68%{transform:scaleY(.58) scaleX(.97)}
  86%{transform:scaleY(.84) scaleX(1)}
  100%{transform:scaleY(1) scaleX(1);filter:brightness(1)}
}

.letter-photo{display:block;width:min(100%,300px);height:auto;max-height:390px;object-fit:cover;margin:0 auto 20px;border:3px solid #b9782e;border-radius:14px;box-shadow:0 8px 22px rgba(90,45,10,.28);background:#ead09a}
.open .letter-photo{animation:fade 1s .25s both}
.paper h2{margin:0 0 14px;font:600 clamp(28px,7vw,36px)/1.2 'Dancing Script',cursive;color:var(--gold)}
.paper p{margin:0 0 24px;font-size:clamp(16px,4.2vw,18px);line-height:1.7;max-width:34ch;margin-inline:auto}
.open .paper p{animation:fade 1s .5s both}
@keyframes fade{from{opacity:0}}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btns button{min-height:46px;border:1px solid var(--gold);border-radius:99px;padding:11px 20px;font:600 15px 'Be Vietnam Pro',sans-serif;cursor:pointer;color:var(--gold);background:transparent}
.btns button.p{background:var(--gold);color:#5a1200}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cap{margin-top:26px}
@media(max-height:520px){.cap{margin-top:14px;min-height:2.2em;font-size:20px}.paper{padding:22px 22px 18px}.paper p{margin-bottom:16px}.again{padding:10px 22px}}
@media(max-width:380px){.paper{padding:28px 20px 22px}.btns button{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style><style>

/* ===== GỢI Ý CHẠM VÀO LỒNG ĐÈN ===== */
.lantern-hint{
  position:fixed;
  left:50%;
  bottom:9%;
  transform:translateX(-50%);
  z-index:6;
  padding:11px 22px;
  max-width:88vw;
  box-sizing:border-box;
  border:1px solid rgba(255,216,107,.85);
  border-radius:999px;
  color:#fff3b0;
  background:rgba(55,12,10,.68);
  box-shadow:0 0 12px rgba(255,190,60,.45),0 0 28px rgba(255,100,20,.18);
  font:600 16px/1.4 'Be Vietnam Pro',system-ui,sans-serif;
  text-align:center;
  white-space:nowrap;
  pointer-events:none;
  animation:lanternHintGlow 1.8s ease-in-out infinite alternate;
  transition:opacity .5s, transform .5s;
}
@keyframes lanternHintGlow{
  from{opacity:.72;transform:translateX(-50%) translateY(3px)}
  to{opacity:1;transform:translateX(-50%) translateY(-3px)}
}
.open .lantern-hint{opacity:0;transform:translateX(-50%) translateY(10px);}
@media(max-width:600px){
  .lantern-hint{bottom:11%;font-size:14px;white-space:normal;width:84%;padding:9px 14px;}
}
@media(max-height:520px){
  .lantern-hint{bottom:7%;font-size:13px;padding:7px 12px;}
}

/* ===== CẤU HÌNH ẢNH NỀN CHO ĐIỆN THOẠI: HIỆN ĐỦ TOÀN BỘ ẢNH ===== */
/* Đặt SAU rule nền gốc để ghi đè đúng thứ tự.
   Áp dụng cho điện thoại/máy tính bảng (màn hình hẹp hoặc thấp), cả dọc lẫn ngang. */
@media(max-width:900px),(max-height:520px){
  .bg{
    bottom:auto;
    height:100vh;                 /* dự phòng cho trình duyệt cũ */
    height:100lvh;                /* nền không bị giật khi thanh địa chỉ ẩn/hiện */
    overflow:hidden;
    background-color:var(--night);
    -webkit-transform:translateZ(0);transform:translateZ(0);
  }
  /* Lớp dưới: chính bức ảnh đó, phóng to phủ kín + làm mờ để lấp phần trống trên/dưới */
  .bg::before{
    content:"";position:absolute;inset:-30px;
    background-image:inherit;background-size:cover;background-position:center;background-repeat:no-repeat;
    -webkit-filter:blur(22px) brightness(.6) saturate(1.1);filter:blur(22px) brightness(.6) saturate(1.1);
  }
  /* Lớp trên: ảnh nguyên khổ, không bị cắt (contain) */
  .bg::after{
    content:"";position:absolute;inset:0;
    background-image:inherit;background-size:contain;background-position:center;background-repeat:no-repeat;
  }
}

/* ===== HIỆU ỨNG: CANVAS 3D + LỒNG ĐÈN BAY LÊN ===== */
#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
.bg:not(.gl) #fx{display:none}       /* chưa có WebGL -> dùng ảnh CSS tĩnh */
.bg.gl::after{display:none}          /* đã có WebGL -> canvas thay lớp ảnh nét */
.lanterns{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.ln{position:absolute;bottom:0;left:var(--x);width:var(--s);opacity:0;will-change:transform,opacity;
    animation:lnRise var(--d) linear var(--dl) infinite}
.ln i{display:block;position:relative;width:100%;aspect-ratio:.82;
    border-radius:26% 26% 34% 34%/18% 18% 30% 30%;
    background:radial-gradient(ellipse 70% 62% at 50% 78%,#fff1ab 0,#ffc24d 32%,#ee6b1f 70%,#a92c0b 100%);
    box-shadow:0 0 calc(var(--s)*.7) calc(var(--s)*.1) rgba(255,160,50,.55),0 0 calc(var(--s)*1.9) calc(var(--s)*.28) rgba(255,110,20,.2);
    -webkit-filter:blur(var(--b));filter:blur(var(--b));
    animation:lnSway var(--sw) ease-in-out var(--dl) infinite alternate}
.ln i::before{content:"";position:absolute;left:9%;right:9%;top:0;height:9%;border-radius:50%;background:rgba(95,26,6,.55)}
.ln i::after{content:"";position:absolute;inset:8% 5% 9%;border-radius:inherit;
    background:repeating-linear-gradient(90deg,transparent 0 23%,rgba(125,32,6,.26) 23% 25%)}
.ln::after{content:"";position:absolute;left:39%;width:22%;aspect-ratio:1;bottom:-9%;border-radius:50%;
    background:#fff3b5;box-shadow:0 0 calc(var(--s)*.3) calc(var(--s)*.1) rgba(255,205,90,.9);
    animation:lnFlick .4s ease-in-out infinite alternate}
@keyframes lnRise{
  0%{transform:translate3d(0,90px,0);opacity:0}
  9%{opacity:var(--o)}
  84%{opacity:var(--o)}
  100%{transform:translate3d(0,calc(-100vh - 160px),0);opacity:0}
}
@keyframes lnSway{from{transform:translateX(calc(var(--w)*-1)) rotate(-4deg)}to{transform:translateX(var(--w)) rotate(4deg)}}
@keyframes lnFlick{from{opacity:.65;transform:scale(.85)}to{opacity:1;transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){.lanterns{display:none}}
</style>
<style>
/* ===== Chỉ đổi cách mở lời chúc: bấm lồng đèn bay ===== */
.lanterns{pointer-events:auto;z-index:4}
.ln{cursor:pointer;pointer-events:auto}
.ln i{cursor:pointer}
.card{z-index:10}
.open .lanterns{pointer-events:none}
</style>

  </div>
</div>

<script>
const $=s=>document.querySelector(s),B=document.body;
const W=[
`Trung Thu rồi, nên hôm nay đừng để mấy chuyện không vui làm phiền mình nữa. Hôm nay cứ cho mình một ngày thật nhẹ nhàng tận hưởng không khí này một chút.<br><br>
Nếu buồn thì cũng không cần cố tỏ ra vui. Muốn nói chuyện thì cứ nói, muốn yên tĩnh một lúc cũng được. Đừng tự làm khó mình vì những chuyện chưa thể thay đổi.<br><br>
Trung Thu mà, cứ vui được lúc nào thì vui lúc đó. Chỉ cần hôm nay em thấy dễ chịu hơn một chút, vậy là được rồi.
Chúc em một đêm Trung Thu thật bình yên.`
];

let last=-1;

function openWish(){
  if(B.classList.contains('open')) return;
  let i;
  do{i=Math.floor(Math.random()*W.length)}while(i===last && W.length>1);
  last=i;
  $('#wish').innerHTML=W[i];
  B.classList.add('open');
}

function closeWish(){
  B.classList.remove('open');
}

$('#lanterns').addEventListener('click',function(e){
  const lantern=e.target.closest('.ln');
  if(!lantern) return;
  openWish();
});

$('#close').onclick=closeWish;

document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && B.classList.contains('open')) closeWish();
});
</script>

<script>
/* ===== Lồng đèn bay lên ===== */
(function(){
  var box=document.getElementById('lanterns');
  if(!box||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var k=Math.max(.75,Math.min(1.5,Math.min(innerWidth,innerHeight)/520));
  var n=innerWidth<600?12:20;
  for(var i=0;i<n;i++){
    var z=Math.random();                    /* 0 = xa, 1 = gần */
    var s=(15+z*30)*k, d=38-z*18+Math.random()*4, el=document.createElement('div'), st=el.style;
    el.className='ln';
    st.setProperty('--x',((i+Math.random()*.8)/n*94+1)+'%');
    st.setProperty('--s',s.toFixed(1)+'px');
    st.setProperty('--d',d.toFixed(1)+'s');
    st.setProperty('--dl',(-Math.random()*d).toFixed(1)+'s');
    st.setProperty('--sw',(3.5+Math.random()*3).toFixed(1)+'s');
    st.setProperty('--w',(s*(.25+Math.random()*.5)).toFixed(1)+'px');
    st.setProperty('--o',(.45+z*.5).toFixed(2));
    st.setProperty('--b',z<.25?'1.2px':'0px');
    el.appendChild(document.createElement('i'));
    box.appendChild(el);
  }
})();

  function init(im){

      ' o+=vec2(sin(t*1.3+1.)*.0022,sin(t*3.1+.6)*.0042)*m.g*uK;',           /* bé trai: cười lắc lư */
